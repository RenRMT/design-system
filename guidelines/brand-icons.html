<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--bg)}.m{font:11px/1.4 var(--font-mono);color:var(--muted)}.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border-radius:3px;box-shadow:var(--hairline);font-size:12px;line-height:1.3;min-height:84px}.sw b{font-weight:600}.sw span{font:11px var(--font-mono)}.r{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 8px}.r div{display:flex;flex-direction:column;align-items:center;gap:4px}.r img{width:28px;height:28px;image-rendering:auto}</style></head><body><div class="r"><div><img src="../assets/icons/i_chart_vbar.png" alt=""><span class="m">vbar</span></div><div><img src="../assets/icons/i_chart_hbar.png" alt=""><span class="m">hbar</span></div><div><img src="../assets/icons/i_chart_line.png" alt=""><span class="m">line</span></div><div><img src="../assets/icons/i_chart_area.png" alt=""><span class="m">area</span></div><div><img src="../assets/icons/i_chart_v_stacked.png" alt=""><span class="m">v stacked</span></div><div><img src="../assets/icons/i_chart_h_stacked.png" alt=""><span class="m">h stacked</span></div><div><img src="../assets/icons/i_chart_100_area.png" alt=""><span class="m">100 area</span></div><div><img src="../assets/icons/i_chart_scatter.png" alt=""><span class="m">scatter</span></div><div><img src="../assets/icons/i_chart_bubble.png" alt=""><span class="m">bubble</span></div><div><img src="../assets/icons/i_chart_lollipop.png" alt=""><span class="m">lollipop</span></div><div><img src="../assets/icons/i_chart_boxwhisker.png" alt=""><span class="m">boxwhisker</span></div><div><img src="../assets/icons/i_chart_pie.png" alt=""><span class="m">pie</span></div><div><img src="../assets/icons/i_chart_donut.png" alt=""><span class="m">donut</span></div><div><img src="../assets/icons/i_chart_treemap.png" alt=""><span class="m">treemap</span></div></div></body></html>
