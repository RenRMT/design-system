<!-- @dsCard group="Spacing" viewport="700x300" name="Rhythm in use" subtitle="Tight inside a group, open between groups, wide between sections" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--bg)}.m{font:11px/1.4 var(--font-mono);color:var(--muted)}.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border-radius:3px;box-shadow:var(--hairline);font-size:12px;line-height:1.3;min-height:84px}.sw b{font-weight:600}.sw span{font:11px var(--font-mono)}.lbl{font:11px var(--font-mono);color:var(--accent);background:var(--ren-black);padding:1px 5px;border-radius:0}</style></head><body><div style="display:grid;grid-template-columns:1fr 160px;gap:32px"><div><p style="font:13px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--link);margin:0">Hello</p><div style="height:6px"></div><div style="font:500 34px/1.1 var(--font-serif)">I build tools that make aid data work</div><div style="height:18px"></div><p style="margin:0;color:var(--muted)">Data pipelines and quality checks for humanitarian and aid data.</p><div style="height:56px;border-left:1px dashed var(--accent);margin:4px 0 4px 6px"></div><div style="font:500 22px var(--font-serif)">Work</div></div><div class="m" style="display:flex;flex-direction:column;gap:10px;padding-top:10px"><span><span class="lbl">6</span> eyebrow → title</span><span><span class="lbl">18</span> title → lead</span><span style="margin-top:28px"><span class="lbl">56</span> hero → section</span><span><span class="lbl">16</span> section head → grid</span><span><span class="lbl">20</span> card gap</span></div></div></body></html>
