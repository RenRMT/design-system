<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--bg)}.m{font:11px/1.4 var(--font-mono);color:var(--muted)}.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border-radius:3px;box-shadow:var(--hairline);font-size:12px;line-height:1.3;min-height:84px}.sw b{font-weight:600}.sw span{font:11px var(--font-mono)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}</style></head><body><div class="g"><div class="sw" style="background:#FFFFFF;color:#191919"><b>White</b><span>#FFFFFF · surface</span></div><div class="sw" style="background:#F9F9F9;color:#191919"><b>Neutral</b><span>#F9F9F9 · page</span></div><div class="sw" style="background:#ECECEC;color:#191919"><b>Platinum</b><span>#ECECEC · gridlines</span></div><div class="sw" style="background:#B8B8B8;color:#191919"><b>Steel</b><span>#B8B8B8 · context data</span></div><div class="sw" style="background:#5C6B68;color:#FFFFFF"><b>Slate</b><span>#5C6B68 · muted text</span></div></div></body></html>
