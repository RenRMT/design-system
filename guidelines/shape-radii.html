<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & borders" subtitle="0 for markers, 3px for everything else, 0 for buttons. Hairlines, never shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--bg)}.m{font:11px/1.4 var(--font-mono);color:var(--muted)}.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border-radius:3px;box-shadow:var(--hairline);font-size:12px;line-height:1.3;min-height:84px}.sw b{font-weight:600}.sw span{font:11px var(--font-mono)}.r{display:flex;gap:28px;align-items:flex-end}.r>div{display:flex;flex-direction:column;gap:8px;align-items:flex-start}</style></head><body><div class="r"><div><span style="width:10px;height:10px;background:var(--accent);display:block"></span><span class="m">0 · marker</span></div><div><code>code</code><span class="m">3 · code, select, alert</span></div><div><span style="width:120px;height:64px;border:1px solid var(--line);border-radius:3px;background:var(--surface);display:block"></span><span class="m">3 · card, figure (max)</span></div><div><span style="display:flex;gap:8px"><span style="padding:10px 20px;background:var(--accent);font-weight:600;font-size:14px">Work</span><span style="padding:10px 20px;box-shadow:inset 0 0 0 1.5px var(--link);color:var(--link);font-weight:600;font-size:14px">Play</span></span><span class="m">0 · buttons</span></div><div><span style="display:inline-flex;align-items:center;gap:6px;font:12px var(--font-mono);color:var(--muted)"><i style="width:6px;height:6px;background:var(--teal-4)"></i>IATI</span><span class="m">0 · tag key, filter tab</span></div><div><span style="width:120px;height:64px;border-top:4px solid var(--link);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:3px;background:var(--surface);display:block"></span><span class="m">4px top rule · BAN</span></div></div></body></html>
