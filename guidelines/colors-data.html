<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--bg)}.m{font:11px/1.4 var(--font-mono);color:var(--muted)}.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border-radius:3px;box-shadow:var(--hairline);font-size:12px;line-height:1.3;min-height:84px}.sw b{font-weight:600}.sw span{font:11px var(--font-mono)}.g{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.sw{min-height:96px}.n{font:600 11px var(--font-mono);opacity:.8}</style></head><body><div class="g"><div class="sw" style="background:#338877;color:#191919"><span class="n">1</span><b>Teal</b><span>#338877</span></div><div class="sw" style="background:#FFDD77;color:#191919"><span class="n">2</span><b>Jasmine</b><span>#FFDD77</span></div><div class="sw" style="background:#2B5B9B;color:#FFFFFF"><span class="n">3</span><b>Baltic</b><span>#2B5B9B</span></div><div class="sw" style="background:#FF9779;color:#191919"><span class="n">4</span><b>Coral</b><span>#FF9779</span></div><div class="sw" style="background:#88CCFF;color:#191919"><span class="n">5</span><b>Sky</b><span>#88CCFF</span></div><div class="sw" style="background:#BC3C4C;color:#FFFFFF"><span class="n">6</span><b>Cherry</b><span>#BC3C4C</span></div><div class="sw" style="background:#FFBBDD;color:#191919"><span class="n">7</span><b>Blush</b><span>#FFBBDD</span></div><div class="sw" style="background:#8833AA;color:#FFFFFF"><span class="n">8</span><b>Violet</b><span>#8833AA</span></div><div class="sw" style="background:#B8B8B8;color:#191919"><span class="n">other</span><b>Steel</b><span>#B8B8B8</span></div></div></body></html>
