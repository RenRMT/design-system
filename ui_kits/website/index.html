<!-- @dsCard group="Website" viewport="1280x800" name="rendata.nl" subtitle="Home, Work/Play with tag filters, Blog, Post, About, 404" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REN Data</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="kit.css">
<style>@media (max-width:1180px){.hero{grid-template-columns:minmax(0,640px)!important}.hero aside{max-width:320px}}@media (max-width:860px){.about{grid-template-columns:1fr!important}}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script><script type="text/babel" src="Home.jsx"></script><script type="text/babel" src="Track.jsx"></script><script type="text/babel" src="Blog.jsx"></script><script type="text/babel" src="Post.jsx"></script><script type="text/babel" src="About.jsx"></script><script type="text/babel" src="NotFound.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState(()=>localStorage.getItem('ren-kit-page')||'home');
  const [post,setPost]=React.useState(0);
  const [theme,setTheme]=React.useState(()=>localStorage.getItem('getij-theme')||'light');
  React.useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem('getij-theme',theme)},[theme]);
  React.useEffect(()=>{localStorage.setItem('ren-kit-page',page);window.scrollTo(0,0)},[page,post]);
  const go=p=>setPage(p);
  const openPost=(p,i)=>{setPost(i);setPage('post')};
  let body;
  if(page==='home') body=<Home go={go} openPost={openPost}/>;
  else if(page==='work'||page==='play') body=<Track track={page}/>;
  else if(page==='blog') body=<Blog openPost={openPost}/>;
  else if(page==='post') body=<Post post={window.REN_DATA.posts[post]} go={go}/>;
  else if(page==='about') body=<About/>;
  else body=<NotFound go={go}/>;
  return <Shell page={page} go={go} theme={theme} setTheme={setTheme}>{body}
    <p style={{marginTop:72,font:'12px var(--font-mono)',color:'var(--muted)'}}><a href="#" onClick={e=>{e.preventDefault();go('404')}}>View the 404 page</a></p></Shell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
